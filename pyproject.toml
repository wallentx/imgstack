[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgstack"
version = "0.1.0"
description = "Align or subject-lock image stacks and export animated images or video."
requires-python = ">=3.10"
dependencies = [
    "imageio>=2.33.0",
    "numpy>=1.24.0",
]
scripts = { imgstack = "imgstack:main" }

[project.optional-dependencies]
opencv = ["opencv-python>=4.8.0.76"]

[dependency-groups]
# PyInstaller 6.20 added Python 3.13+ Termux platform detection.
build = ["pyinstaller>=6.20"]

[tool.setuptools]
py-modules = ["imgstack", "subject_detectors", "subject_lock"]

[tool.setuptools.data-files]
"share/imgstack/models" = ["models/*.onnx", "models/NOTICE.md"]

[tool.uv]
managed = true
